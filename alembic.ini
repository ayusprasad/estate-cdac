# A generic, single database configuration.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
recursive_version_locations = false

# Database URL — overridden by env_db() in env.py
sqlalchemy.url = postgresql+asyncpg://docurag_user:password@localhost:5432/docurag

[post_write_hooks]
# Run ruff formatter on generated migration files
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
