# ============================================================
# DocuRAG — Docker Compose
# Services: PostgreSQL + pgvector, Redis, API, Celery Worker
# ============================================================
version: '3.9'

services:

  # ── PostgreSQL with pgvector ────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docurag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docurag}
      POSTGRES_USER: ${POSTGRES_USER:-docurag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docurag_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docurag_user} -d ${POSTGRES_DB:-docurag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docurag_net

  # ── Redis (task broker + cache) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docurag_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - docurag_net

  # ── FastAPI Application ──────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: docurag_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ../app:/app/app:ro
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - docurag_net

  # ── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: docurag_worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ../app:/app/app:ro
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    networks:
      - docurag_net

volumes:
  postgres_data:
  redis_data:

networks:
  docurag_net:
    driver: bridge
